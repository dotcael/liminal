# Zero-touch renewal config — consumed by ~/Developer/ios-autorenew.sh
# ($DIR = this file's directory). Docs: ~/Developer/AUTORENEW.md
#
# Install:   ~/Developer/ios-autorenew.sh --install-agent   "$DIR/autorenew.conf"
# Uninstall: ~/Developer/ios-autorenew.sh --uninstall-agent "$DIR/autorenew.conf"

LABEL="com.autorenew.liminal"
MINUTE=17            # hourly ticks 9:17–23:17 (staggered vs other projects)
THRESHOLD_DAYS=2     # rebuild when profile is within 2 days of expiry

# Debug variant on purpose: skips Dart AOT + Firebase release optimization →
# warm renewal rebuilds in ~1–4 min instead of 15–35. The phone runs a debug
# build; manually run `./ios/renew-ios.sh` (release) anytime you want the
# fast variant back on the phone.
APP="$DIR/../build/ios/Debug-iphoneos/Runner.app"
BUILD_CMD="$DIR/renew-ios.sh --debug --build-only"
INSTALL_CMD="$DIR/renew-ios.sh --install-only --no-launch --debug"

LOG="$DIR/../build/autorenew.log"
STATE="$DIR/../build/autorenew.state"
LOCK="$DIR/../build/autorenew.lock"
